<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanline - AI Product Trust Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            height: 90vh;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
            }
        }

        .section {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .input-group {
            padding: 20px;
            border-bottom: 1px solid #eee;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .input-group button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .input-group button:hover {
            transform: scale(1.02);
        }

        .input-group button:active {
            transform: scale(0.98);
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .analysis-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .metric {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .metric h3 {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .metric .value {
            font-size: 28px;
            font-weight: bold;
        }

        .reviews-section {
            margin-top: 20px;
        }

        .reviews-section h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .review-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 4px solid #667eea;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .review-author {
            font-weight: bold;
            color: #333;
        }

        .review-rating {
            color: #ffc107;
            font-weight: bold;
        }

        .review-text {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .review-image {
            width: 100%;
            max-width: 200px;
            height: auto;
            border-radius: 6px;
            margin-top: 8px;
        }

        .review-verdict {
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 8px;
        }

        .review-verdict.positive {
            background: #d4edda;
            color: #155724;
        }

        .review-verdict.negative {
            background: #f8d7da;
            color: #721c24;
        }

        .review-verdict.suspicious {
            background: #fff3cd;
            color: #856404;
        }

        /* Chat Section */
        .chat-messages {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            padding: 12px 15px;
            border-radius: 8px;
            max-width: 90%;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .message.bot {
            align-self: flex-start;
            background: #f0f0f0;
            color: #333;
            border-bottom-left-radius: 2px;
        }

        .message.bot .bot-avatar {
            display: inline-block;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 24px;
            font-size: 14px;
            margin-right: 8px;
        }

        .suggestion {
            background: #e7f3ff;
            color: #0056b3;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-top: 8px;
            border-left: 3px solid #0056b3;
        }

        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: blink 1.4s infinite;
        }

        .loading:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0%, 60%, 100% {
                opacity: 0.5;
            }
            30% {
                opacity: 1;
            }
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .alternatives {
            margin-top: 15px;
        }

        .alternatives h4 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .alternative-item {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .alternative-item .price {
            color: #28a745;
            font-weight: bold;
        }

        .trust-signals {
            margin-top: 15px;
        }

        .trust-signals h4 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .signal-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .signal-item .icon {
            margin-right: 8px;
            font-size: 16px;
        }

        .signal-item.passed .icon {
            color: #28a745;
        }

        .signal-item.failed .icon {
            color: #dc3545;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #721c24;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #155724;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Left Panel: Analysis -->
        <div class="section">
            <div class="header">
                <h1>🔍 Scanline</h1>
                <p>AI Product Trust Analysis</p>
            </div>
            <div class="input-group">
                <input type="url" id="urlInput" placeholder="Enter product URL..." value="">
                <button onclick="analyzeURL()">Analyze Product</button>
            </div>
            <div class="content" id="analysisContent">
                <div class="empty-state">
                    <div class="empty-state-icon">🏪</div>
                    <p>Enter a product URL to start analysis</p>
                </div>
            </div>
        </div>

        <!-- Right Panel: Chat Bot -->
        <div class="section">
            <div class="header">
                <h1>🤖 Scanline Bot</h1>
                <p>Your AI Shopping Assistant</p>
            </div>
            <div class="content">
                <div class="chat-messages" id="chatMessages">
                    <div class="message bot">
                        <span class="bot-avatar">🤖</span>
                        <div>
                            <strong>Scanline Bot:</strong> Hi! 👋 I'm your AI shopping assistant. Paste a product URL on the left and I'll analyze it. Then ask me anything about it!
                        </div>
                    </div>
                </div>
            </div>
            <div class="input-group">
                <input type="text" id="chatInput" placeholder="Ask me anything about the product..." onkeypress="handleChatKeypress(event)">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        let currentAnalysis = null;

        async function analyzeURL() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) {
                showError('Please enter a valid URL');
                return;
            }

            const analysisContent = document.getElementById('analysisContent');
            analysisContent.innerHTML = '<div class="spinner"></div>';

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                if (!response.ok) throw new Error('Analysis failed');
                currentAnalysis = await response.json();
                displayAnalysis(currentAnalysis);
                addBotMessage('Great! I analyzed the product. What would you like to know about it?');
            } catch (error) {
                showError('Failed to analyze URL. Please try again.');
            }
        }

        function displayAnalysis(analysis) {
            const content = document.getElementById('analysisContent');
            const recommendation = analysis.recommendation;
            const sentiment = analysis.sentiment;
            const fakeReviews = analysis.fake_reviews;

            let html = `
                <div class="analysis-grid">
                    <div class="metric">
                        <h3>Trust Score</h3>
                        <div class="value">${recommendation.score || 0}/100</div>
                    </div>
                    <div class="metric">
                        <h3>Sentiment</h3>
                        <div class="value">${Math.round((sentiment.positive / (sentiment.positive + sentiment.negative + sentiment.neutral)) * 100) || 0}%</div>
                    </div>
                    <div class="metric">
                        <h3>Reviews</h3>
                        <div class="value">${sentiment.positive || 0}</div>
                    </div>
                    <div class="metric">
                        <h3>Fake Risk</h3>
                        <div class="value">${fakeReviews.risk_level || 'N/A'}</div>
                    </div>
                </div>

                <div class="reviews-section">
                    <h3>💬 Top Reviews</h3>
                    ${analysis.reviews.slice(0, 3).map(review => `
                        <div class="review-item">
                            <div class="review-header">
                                <span class="review-author">${review.author || 'Anonymous'}</span>
                                <span class="review-rating">${'⭐'.repeat(review.rating || 0)}</span>
                            </div>
                            <div class="review-text">${review.text || review.title || 'No text'}</div>
                            ${review.image_url ? `<img src="${review.image_url}" alt="Review" class="review-image">` : ''}
                            <span class="review-verdict ${review.is_positive ? 'positive' : 'negative'}">
                                ${review.is_positive ? '✅ Helpful' : '⚠️ Negative'}
                            </span>
                        </div>
                    `).join('')}
                </div>

                ${analysis.alternatives && analysis.alternatives.length > 0 ? `
                    <div class="alternatives">
                        <h4>💡 Better Alternatives</h4>
                        ${analysis.alternatives.slice(0, 2).map(alt => `
                            <div class="alternative-item">
                                ${alt.name} - <span class="price">$${alt.price || 0}</span>
                            </div>
                        `).join('')}
                    </div>
                ` : ''}

                ${analysis.trust_signals && analysis.trust_signals.length > 0 ? `
                    <div class="trust-signals">
                        <h4>🛡️ Security Signals</h4>
                        ${analysis.trust_signals.map(signal => `
                            <div class="signal-item ${signal.passed ? 'passed' : 'failed'}">
                                <span class="icon">${signal.passed ? '✅' : '❌'}</span>
                                <span>${signal.name}</span>
                            </div>
                        `).join('')}
                    </div>
                ` : ''}

                <div class="success" style="margin-top: 15px;">
                    <strong>${recommendation.verdict}</strong><br>
                    ${recommendation.explanation ? recommendation.explanation.join(' ') : 'Ask me more about this product!'}
                </div>
            `;

            content.innerHTML = html;
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();

            if (!message) return;

            if (!currentAnalysis) {
                addBotMessage('Please analyze a product first! 👈');
                return;
            }

            addUserMessage(message);
            input.value = '';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message,
                        analysis: currentAnalysis
                    })
                });

                if (!response.ok) throw new Error('Chat failed');
                const data = await response.json();
                addBotMessage(data.reply, data.suggestion);
            } catch (error) {
                addBotMessage('Sorry, I had trouble understanding that. Can you rephrase?');
            }
        }

        function handleChatKeypress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function addUserMessage(text) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageEl = document.createElement('div');
            messageEl.className = 'message user';
            messageEl.textContent = text;
            messagesDiv.appendChild(messageEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function addBotMessage(text, suggestion = '') {
            const messagesDiv = document.getElementById('chatMessages');
            const messageEl = document.createElement('div');
            messageEl.className = 'message bot';
            messageEl.innerHTML = `
                <span class="bot-avatar">🤖</span>
                <div>
                    <strong>Scanline Bot:</strong><br>
                    ${text.replace(/\n/g, '<br>')}
                    ${suggestion ? `<div class="suggestion">💡 ${suggestion}</div>` : ''}
                </div>
            `;
            messagesDiv.appendChild(messageEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function showError(message) {
            const content = document.getElementById('analysisContent');
            content.innerHTML = `<div class="error">${message}</div>`;
        }

        // Welcome message
        addBotMessage('Welcome to Scanline! 🎉 Paste a product URL to start analyzing. I can help with reviews, prices, authenticity, and buying decisions!');
    </script>
</body>
</html>
