<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanline - AI Trust Analyzer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1200px;
            width: 100%;
            padding: 40px;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 { color: #333; font-size: 2.5em; margin-bottom: 10px; }
        .header p { color: #666; font-size: 1.1em; }
        .demo-banner {
            background: #fff3cd;
            border-left: 4px solid #ff9800;
            padding: 12px 16px;
            margin-bottom: 20px;
            border-radius: 4px;
            color: #856404;
            font-size: 0.9em;
        }
        .search-section {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        .search-section input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
        }
        .search-section button {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .search-section button:hover { background: #5568d3; }
        .search-section button:disabled { background: #ccc; cursor: not-allowed; }
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .results {
            display: none;
        }
        .results.show { display: block; }
        .verdict-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 6px solid #ddd;
        }
        .verdict-card.green { border-left-color: #4caf50; }
        .verdict-card.yellow { border-left-color: #ff9800; }
        .verdict-card.red { border-left-color: #f44336; }
        .verdict-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .score {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin: 0 10px 0 0;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-top: 4px solid #667eea;
        }
        .card h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.1em;
        }
        .card-content {
            color: #666;
            font-size: 0.95em;
            line-height: 1.6;
        }
        .chart-container {
            position: relative;
            height: 300px;
            margin-top: 20px;
        }
        .signal {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .signal:last-child { border-bottom: none; }
        .signal-icon {
            font-size: 1.3em;
            width: 24px;
        }
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Scanline</h1>
            <p>AI-Powered Product & Website Trust Analyzer</p>
        </div>

        <div class="demo-banner">
            📊 Demo Mode: Results are simulated for demonstration. In production, this would use real review APIs, pricing data, and threat intelligence.
        </div>

        <div class="search-section">
            <input type="url" id="urlInput" placeholder="Paste a product or website URL..." value="https://www.example-store.com/products/wireless-earbuds">
            <button onclick="analyzeURL()" id="analyzeBtn">Analyze</button>
        </div>

        <div class="loading" id="loading" style="display:none;">
            <div class="spinner"></div>
            <p>Analyzing...</p>
        </div>

        <div class="results" id="results"></div>
    </div>

    <script>
        async function analyzeURL() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) {
                alert('Please enter a URL');
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').innerHTML = '';
            document.getElementById('analyzeBtn').disabled = true;

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                if (!response.ok) throw new Error(`Error: ${response.status}`);
                const data = await response.json();
                displayResults(data);
            } catch (error) {
                document.getElementById('results').innerHTML = `<div class="error">Error: ${error.message}</div>`;
                document.getElementById('results').classList.add('show');
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('analyzeBtn').disabled = false;
            }
        }

        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            const recommendation = data.recommendation;

            let html = `
                <div class="verdict-card ${recommendation.color}">
                    <div class="verdict-title">
                        <span class="score">${recommendation.emoji}</span>
                        <div>
                            <div>${recommendation.verdict}</div>
                            <div style="font-size: 0.7em; color: #999;">Trust Score: ${recommendation.score}/100</div>
                        </div>
                    </div>
                    <div class="card-content">
                        ${recommendation.explanation.join('<br>')}
                    </div>
                </div>

                <div class="grid">
                    <div class="card">
                        <h3>📊 Sentiment Breakdown</h3>
                        <div class="chart-container">
                            <canvas id="sentimentChart"></canvas>
                        </div>
                    </div>

                    <div class="card">
                        <h3>🚨 Fake Review Analysis</h3>
                        <div class="card-content">
                            <strong>Risk Level: ${data.fake_reviews.risk_level.toUpperCase()}</strong><br>
                            Suspicious: ${data.fake_reviews.suspicious_count}/${data.fake_reviews.total_reviews}
                        </div>
                    </div>

                    <div class="card">
                        <h3>💰 Price Comparison</h3>
                        <div class="card-content">
                            ${data.prices.map(p => `${p.seller}: $${p.price.toFixed(2)}`).join('<br>')}
                        </div>
                    </div>

                    <div class="card">
                        <h3>🛡️ Trust Signals</h3>
                        <div class="card-content">
                            ${data.trust_signals.map(s => `<div class="signal"><span class="signal-icon">${s.passed ? '✓' : '✗'}</span><span>${s.detail}</span></div>`).join('')}
                        </div>
                    </div>
                </div>
            `;

            resultsDiv.innerHTML = html;
            resultsDiv.classList.add('show');

            const ctx = document.getElementById('sentimentChart').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Positive', 'Neutral', 'Negative'],
                    datasets: [{
                        data: [data.sentiment.positive, data.sentiment.neutral, data.sentiment.negative],
                        backgroundColor: ['#4caf50', '#ff9800', '#f44336']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        document.getElementById('urlInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') analyzeURL();
        });
    </script>
</body>
</html>
